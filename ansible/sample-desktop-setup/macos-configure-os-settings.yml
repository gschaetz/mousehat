# osx_defaults settings, grouped by domain (once per domain) then by key.
# Each key's {type, value, state} mirrors what the osx_defaults ansible module
# takes; state: absent needs no type/value. See known-defaults.yml for the
# fuller catalog of settings mh-check knows how to import from a live machine.
osx_defaults:
    NSGlobalDomain:
        # restore default highlight color (blue)
        AppleHighlightColor: {state: absent}
        # restore default automatic termination of inactive apps
        NSDisableAutomaticTermination: {state: absent}
        # Always show scrollbars. Possible values: `WhenScrolling`, `Automatic` and `Always`
        AppleShowScrollBars: {type: string, value: 'Always', state: present}
        # Disable smart quotes/dashes and spelling correction as they’re annoying when typing code
        NSAutomaticQuoteSubstitutionEnabled: {type: bool, value: false, state: present}
        NSAutomaticDashSubstitutionEnabled: {type: bool, value: false, state: present}
        NSAutomaticSpellingCorrectionEnabled: {type: bool, value: false, state: present}
        # Set sidebar icon size to small
        NSTableViewDefaultSizeMode: {type: int, value: 1, state: present}
        # Disable press-and-hold for keys in favor of key repeat, and set a fast repeat rate
        ApplePressAndHoldEnabled: {type: bool, value: false, state: present}
        InitialKeyRepeat: {type: int, value: 25, state: present}
        KeyRepeat: {type: int, value: 1, state: present}
        # Set locale
        AppleLanguages: {type: array, value: ["en"], state: present}
        AppleMeasurementUnits: {type: string, value: "Inches", state: present}
        AppleMetricUnits: {type: bool, value: false, state: present}
        AppleICUForce24HourTime: {type: bool, value: true, state: present}
        # Enable spring loading for directories, with no delay
        com.apple.springing.enabled: {type: bool, value: true, state: present}
        com.apple.springing.delay: {type: float, value: 0, state: present}
        ### Trackpad (tap to click, force click, tracking speed)
        com.apple.mouse.tapBehavior: {type: int, value: 1, state: present}
        com.apple.trackpad.forceClick: {type: int, value: 1, state: present}
        com.apple.trackpad.scaling: {type: float, value: 0.875, state: present}
    # Avoid creating .DS_Store files on network volumes
    com.apple.desktopservices:
        DSDontWriteNetworkStores: {type: bool, value: true, state: present}
    ### Trackpad
    com.apple.AppleMultitouchTrackpad:
        # tap to click
        Clicking: {type: int, value: 1, state: present}
        # Three finger drag
        TrackpadThreeFingerDrag: {type: bool, value: true, state: present}
        # Four finger horizontal left/right desktop change
        TrackpadFourFingerHorizSwipeGesture: {type: int, value: 2, state: present}
        TrackpadThreeFingerHorizSwipeGesture: {type: int, value: 0, state: present}
        # Four finger vertical app expose
        TrackpadFourFingerVertSwipeGesture: {type: int, value: 2, state: present}
        TrackpadThreeFingerVertSwipeGesture: {type: int, value: 0, state: present}
    com.apple.driver.AppleBluetoothMultitouch.trackpad:
        # tap to click
        Clicking: {type: int, value: 1, state: present}
###############################################################################
## FINDER
###############################################################################
    com.apple.finder:
        # Finder: allow quitting via ⌘ + Q; Quitting finder removes the desktop too
        QuitMenuItem: {type: bool, value: true, state: present}
        # Set Home as the default location for new Finder windows
        NewWindowTarget: {type: string, value: PfHm, state: present}
        NewWindowTargetPath: {type: string, value: "file://${HOME}/", state: present}
        # Show icons for hard drives, servers, and removable media on the desktop
        ShowExternalHardDrivesOnDesktop: {type: bool, value: true, state: present}
        ShowHardDrivesOnDesktop: {type: bool, value: true, state: present}
        ShowMountedServersOnDesktop: {type: bool, value: true, state: present}
        ShowRemovableMediaOnDesktop: {type: bool, value: true, state: present}
        # Finder: show all filename extensions
        AppleShowAllExtensions: {type: bool, value: true, state: present}
        # Finder: show hidden files (dotfiles, Library, etc.)
        AppleShowAllFiles: {type: bool, value: true, state: present}
        # Finder: show status bar
        ShowStatusBar: {type: bool, value: true, state: present}
        # Finder: show path bar
        ShowPathbar: {type: bool, value: true, state: present}
        # Display full POSIX path as Finder window title
        _FXShowPosixPathInTitle: {type: bool, value: true, state: present}
        # When performing a search, search the current folder by default
        FXDefaultSearchScope: {type: string, value: SCcf, state: present}
        # Disable the warning when changing a file extension
        FXEnableExtensionChangeWarning: {type: bool, value: false, state: present}
        # Use list view in all Finder windows by default
        # Four-letter codes for the other view modes: `icnv`, `clmv`, `Flwv`
        FXPreferredViewStyle: {type: string, value: Nlsv, state: present}
        # Disable the warning before emptying the Trash
        WarnOnEmptyTrash: {type: bool, value: false, state: present}
###############################################################################
# Dock and hot corners
###############################################################################
    com.apple.dock:
        # Set the icon size of Dock items to 50 pixels
        tilesize: {type: float, value: 50, state: present}
        # Minimize windows into their application’s icon
        minimize-to-application: {type: bool, value: true, state: present}
        # Change minimize/maximize window effect
        mineffect: {type: string, value: "genie", state: present}
        # Automatically hide and show the Dock
        autohide: {type: bool, value: false, state: present}
        # Show indicator lights for open applications in the Dock
        show-process-indicators: {type: bool, value: true, state: present}
        # Enable highlight hover effect for the grid view of a stack (Dock)
        mouse-over-hilite-stack: {type: bool, value: true, state: present}
        # Enable spring loading for all Dock items
        enable-spring-load-actions-on-all-items: {type: bool, value: true, state: present}
        # Make Dock icons of hidden applications translucent
        showhidden: {type: bool, value: true, state: present}
        # Don’t automatically rearrange Spaces based on most recent use
        mru-spaces: {type: bool, value: false, state: present}
        # Hot corners. Possible values:
        #  0: no-op                5: Start screen saver    11: Launchpad
        #  2: Mission Control      6: Disable screen saver  12: Notification Center
        #  3: Show app windows     7: Dashboard
        #  4: Desktop             10: Put display to sleep
        # Top left screen corner → Launchpad
        wvous-tl-corner: {type: int, value: 0, state: present}
        wvous-tl-modifier: {type: int, value: 0, state: present}
        # Top right screen corner → Desktop
        wvous-tr-corner: {type: int, value: 4, state: present}
        wvous-tr-modifier: {type: int, value: 0, state: present}
        # Bottom right screen corner → Start screen saver
        wvous-br-corner: {type: int, value: 5, state: present}
        wvous-br-modifier: {type: int, value: 0, state: present}
        # Bottom left screen corner → Mission Control
        wvous-bl-corner: {type: int, value: 2, state: present}
        wvous-bl-modifier: {type: int, value: 0, state: present}
###############################################################################
# Screen
###############################################################################
    com.apple.screensaver:
        # Require password after sleep or screen saver begins
        askForPassword: {type: int, value: 1, state: present}
        askForPasswordDelay: {type: int, value: 5, state: present}
    com.apple.screencapture:
        # Save screenshots to the desktop, disable shadow, use PNG (other options: BMP, GIF, JPG, PDF, TIFF)
        location: {type: string, value: "${HOME}/Desktop", state: present}
        disable-shadow: {type: bool, value: true, state: present}
        type: {type: string, value: "png", state: present}
###############################################################################
# Activity Monitor
###############################################################################
    com.apple.ActivityMonitor:
        # Show the main window when launching Activity Monitor
        OpenMainWindow: {type: bool, value: true, state: present}
        # Visualize CPU usage in the Activity Monitor Dock icon
        IconType: {type: int, value: 5, state: present}
        # Show all processes in Activity Monitor
        ShowCategory: {type: int, value: 0, state: present}
        # Sort Activity Monitor results by CPU usage
        SortColumn: {type: string, value: "CPUUsage", state: present}
        SortDirection: {type: int, value: 0, state: present}
###############################################################################
# Software updates
###############################################################################
    com.apple.SoftwareUpdate:
        # Enable the automatic update check
        AutomaticCheckEnabled: {type: bool, value: true, state: present}
        # Download newly available updates in background
        AutomaticDownload: {type: int, value: 1, state: present}
        # Install System data files & security updates
        CriticalUpdateInstall: {type: int, value: 1, state: present}
        # Automatically download apps purchased on other Macs
        ConfigDataInstall: {type: int, value: 1, state: present}
        # Check for software updates daily, not just once per week
        ScheduleFrequency: {type: int, value: 1, state: present}
        # Turn on app auto-update
        AutoUpdate: {type: bool, value: true, state: present}
        # Allow the App Store to reboot machine on macOS updates
        AutoUpdateRestartRequired: {type: bool, value: true, state: present}
###############################################################################
# Photos
###############################################################################
    com.apple.ImageCapture:
        # Prevent Photos from opening automatically when devices are plugged in
        disableHotPlug: {type: bool, value: true, state: present}
###############################################################################
# Debug Menus
###############################################################################
    # com.apple.addressbook: {ABShowDebugMenu: {type: bool, value: true, state: present}}
    com.apple.appstore:
        ShowDebugMenu: {type: bool, value: true, state: present}
        WebKitDeveloperExtras: {type: bool, value: true, state: present}
    com.apple.DiskUtility:
        DUDebugMenuEnabled: {type: bool, value: true, state: present}
        advanced-image-options: {type: bool, value: true, state: present}
    com.apple.iCal:
        IncludeDebugMenu: {type: bool, value: true, state: present}
